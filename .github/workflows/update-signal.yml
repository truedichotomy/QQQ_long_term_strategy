# Nightly after-close refresh of the QQQ signal site.
#
# 23:30 UTC is 18:30 EST / 19:30 EDT — comfortably after the 16:00 ET close year-round,
# so the fetched bar is always final (never provisional). `signal.jl --fetch` forces the
# Yahoo pull, merges into data/, regenerates web/data.js, and prints the signal into the
# run log. The refreshed data is committed back to main (GITHUB_TOKEN pushes don't
# re-trigger workflows), then web/ is deployed to GitHub Pages.
name: update-signal

on:
  schedule:
    - cron: '30 23 * * 1-5'   # weekdays 23:30 UTC — after the US close
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['web/**', 'analysis/**', 'data/**']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-signal
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'

      - name: Fetch latest data & compute the signal
        run: |
          julia --startup-file=no analysis/signal.jl --fetch | tee signal.out
          # signal.jl warns-and-continues on fetch problems; fail the run instead so
          # breakage emails us rather than silently serving a stale signal.
          if grep -q -e 'could not fetch' -e 'DATA GAP' signal.out; then
            echo '::error::data fetch problem — see the signal output above'
            exit 1
          fi

      - name: Verify the JS port reproduces the Julia signal bar-for-bar
        run: julia --startup-file=no web/verify_parity.jl

      - name: Detect a change in trade action
        id: flip
        run: node web/signal_state.js

      - name: Commit refreshed data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data web/data.js .github/signal-state.json
          if git diff --cached --quiet; then
            echo 'no new bars (holiday or already current) — nothing to commit'
          else
            git commit -m "Auto-update QQQ data ($(date -u +%F))"
            git pull --rebase origin main
            git push
          fi

      # Subscribers get flip alerts two ways: a GitHub Release (Watch → Custom →
      # Releases emails them; releases.atom is the RSS feed) and an ntfy.sh push
      # (topic kept in the NTFY_TOPIC repo secret so outsiders can't spoof it).
      - name: Publish signal-change release
        if: steps.flip.outputs.flipped == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ steps.flip.outputs.action }}
          EITHER: ${{ steps.flip.outputs.either }}
          PREV: ${{ steps.flip.outputs.prev }}
          ASOF: ${{ steps.flip.outputs.asof }}
          CLOSE: ${{ steps.flip.outputs.close }}
          AVG: ${{ steps.flip.outputs.avg }}
        run: |
          ICON=$([ "$EITHER" = BUY ] && echo '▲' || echo '▼')
          gh release create "signal-$ASOF" \
            --title "$ICON QQQ signal: $ACTION (as of $ASOF)" \
            --notes "The either-on blend changed from $PREV to **$EITHER** as of the $ASOF close (QQQ $CLOSE).

          - Act at the next session's open — the strategy trades with a one-day lag (no look-ahead).
          - Avg ½-size blend exposure: $AVG%.
          - Live signal: https://truedichotomy.github.io/QQQ_long_term_strategy/

          Watch this repo (Custom → Releases) to get these by email. Mechanical backtest rule — not investment advice; you alone are responsible for your trades. See LICENSE."

      - name: Send ntfy push alert
        if: steps.flip.outputs.flipped == 'true'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ACTION: ${{ steps.flip.outputs.action }}
          EITHER: ${{ steps.flip.outputs.either }}
          PREV: ${{ steps.flip.outputs.prev }}
          ASOF: ${{ steps.flip.outputs.asof }}
          CLOSE: ${{ steps.flip.outputs.close }}
          AVG: ${{ steps.flip.outputs.avg }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then echo 'NTFY_TOPIC secret not set — skipping push alert'; exit 0; fi
          TAG=$([ "$EITHER" = BUY ] && echo 'chart_with_upwards_trend' || echo 'chart_with_downwards_trend')
          curl -fsS \
            -H "Title: QQQ signal: $ACTION" \
            -H "Priority: high" \
            -H "Tags: $TAG" \
            -d "As of the $ASOF close (QQQ $CLOSE): $PREV → $EITHER. Avg ½-size: $AVG%. Act at the next open. https://truedichotomy.github.io/QQQ_long_term_strategy/" \
            "https://ntfy.sh/$NTFY_TOPIC" > /dev/null
          echo 'ntfy push sent'

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
